# Alembic config. version_locations and the DB URL are set dynamically in alembic/env.py
# (per-module migration folders + DATABASE_URL from the environment).
[alembic]
script_location = alembic
version_path_separator = space
prepend_sys_path = .
# Django-app style: one migrations folder per module (relative to apps/api).
version_locations = app/modules/organizations/migrations app/modules/jobs/migrations app/modules/workflows/migrations app/modules/candidates/migrations app/modules/interviews/migrations app/modules/webhooks/migrations app/modules/audit/migrations app/modules/sourcing/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
